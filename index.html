<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hip Pocket | Marketing Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --or:#E8650A;--bl:#0A0A0A;--su:#111;--ca:#1A1A1A;--c2:#222;--bo:#2A2A2A;
  --tx:#F0F0F0;--mu:#888;--gr:#22C55E;--re:#EF4444;--yl:#FBBC04;--bu:#3B82F6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bl);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;}
.hdr{background:var(--su);border-bottom:1px solid var(--bo);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;}
.ld{width:30px;height:30px;background:var(--or);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;}
.btn{background:var(--or);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
.btn:hover{background:#d45a08;}
.btn-sm{background:var(--c2);color:var(--tx);border:1px solid var(--bo);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;}
.btn-sm:hover{background:var(--bo);}
.nav{background:var(--su);border-bottom:1px solid var(--bo);padding:0 20px;display:flex;gap:2px;overflow-x:auto;}
.nt{padding:10px 13px;font-size:12px;font-weight:500;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;}
.nt:hover{color:var(--tx);}
.nt.active{color:var(--or);border-bottom-color:var(--or);}
.main{padding:20px;max-width:1400px;margin:0 auto;}
.sec{display:none;}.sec.active{display:block;}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.card{background:var(--ca);border:1px solid var(--bo);border-radius:10px;padding:16px;margin-bottom:16px;}
.ct{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);margin-bottom:12px;}
.kpi{background:var(--ca);border:1px solid var(--bo);border-radius:10px;padding:14px;}
.kl{font-size:10px;color:var(--mu);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.kv{font-size:22px;font-weight:700;line-height:1;margin-bottom:4px;}
.ks{font-size:11px;color:var(--mu);}
.up{color:var(--gr);}.dn{color:var(--re);}
.slbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);margin:20px 0 10px;}
.cw{position:relative;height:220px;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{color:var(--mu);font-weight:500;text-align:left;padding:7px 10px;border-bottom:1px solid var(--bo);font-size:10px;text-transform:uppercase;}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--bo);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--c2);}
.stitle{font-size:15px;font-weight:700;margin-bottom:4px;}
.ssub{font-size:11px;color:var(--mu);margin-bottom:16px;}
.ibox{background:var(--c2);border-left:3px solid var(--or);padding:12px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:12px;line-height:1.6;}
.aidot{width:7px;height:7px;border-radius:50%;background:var(--or);animation:bk 1.2s ease-in-out infinite;display:inline-block;margin:0 2px;}
.aidot:nth-child(2){animation-delay:.2s;}.aidot:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{opacity:.3;}40%{opacity:1;}}
.air{background:var(--c2);border:1px solid var(--bo);border-radius:10px;padding:16px;font-size:13px;line-height:1.8;}
.wk-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;align-items:center;padding:9px 0;border-bottom:1px solid var(--bo);font-size:13px;}
.wk-row:last-child{border-bottom:none;}
.wk-label{color:var(--mu);}
.wk-val{font-weight:600;}
.no-data{color:var(--mu);font-style:italic;font-size:12px;}
.loading-screen{position:fixed;inset:0;background:var(--bl);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.loading-logo{width:48px;height:48px;background:var(--or);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;}
.loading-text{font-size:13px;color:var(--mu);}
.loading-bar{width:200px;height:3px;background:var(--bo);border-radius:3px;overflow:hidden;}
.loading-fill{height:100%;background:var(--or);border-radius:3px;animation:load 1.5s ease-in-out infinite;}
@keyframes load{0%{width:0;transform:translateX(0);}50%{width:60%;}100%{width:100%;transform:translateX(200px);}}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--gr);display:inline-block;margin-right:5px;}
.error-banner{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--re);margin-bottom:16px;}
@media(max-width:800px){.g5,.g4,.g3{grid-template-columns:repeat(2,1fr);}.g2{grid-template-columns:1fr;}.main{padding:12px;}}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:var(--bo);border-radius:3px;}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">HP</div>
  <div style="font-weight:700;font-size:16px;">Hip Pocket <span style="color:var(--or)">Intelligence</span></div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div class="loading-text" id="loadingText">Connecting to Google Sheets…</div>
</div>

<div id="appShell" style="display:none;">
<div class="hdr">
  <div class="logo"><div class="ld">HP</div><div>Hip Pocket <span style="color:var(--or)">Intelligence</span></div></div>
  <div style="display:flex;gap:8px;align-items:center;">
    <span id="dateLabel" style="font-size:11px;color:var(--gr);"><span class="status-dot"></span>Live</span>
    <button class="btn-sm" onclick="refreshData()">↻ Refresh</button>
    <button class="btn" id="aiBtn">🤖 AI Analyst</button>
  </div>
</div>
<div class="nav" id="nav"></div>
<div class="main" id="main"></div>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────
var SHEET_ID = '1hondCS06oCfSoR4Ht51rKD568pACQxZXOD3JnvcaAyQ';
var SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=0';
var STUCK_SPEND = 10.157355; // known stuck Google value to exclude
var BUDGETS = {google:8, metaMk:20, metaAB:8};
var MONTHLY_BUDGET = 1000; // monthly ad spend cap ($)

// ── TABS ─────────────────────────────────────────────────
var TABS = [
  {id:'ov',label:'📊 Overview'},
  {id:'ga',label:'🎯 Google Ads'},
  {id:'ma',label:'📣 Meta Ads'},
  {id:'ig',label:'📸 Instagram'},
  {id:'ww',label:'📅 Week vs Week'},
  {id:'ai',label:'🤖 AI Analyst'},
  {id:'em',label:'✉️ Email Report'}
];

var navEl = document.getElementById('nav');
var mainEl = document.getElementById('main');
TABS.forEach(function(t,i){
  var btn = document.createElement('div');
  btn.className = 'nt' + (i===0?' active':'');
  btn.textContent = t.label;
  btn.onclick = function(){showTab(t.id);};
  navEl.appendChild(btn);
  var sec = document.createElement('div');
  sec.className = 'sec' + (i===0?' active':'');
  sec.id = 'sec-' + t.id;
  mainEl.appendChild(sec);
});

function showTab(id){
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.nt').forEach(function(t){t.classList.remove('active');});
  document.getElementById('sec-'+id).classList.add('active');
  TABS.forEach(function(t,i){if(t.id===id)navEl.children[i].classList.add('active');});
}
document.getElementById('aiBtn').onclick = function(){showTab('ai');doAI();};

// ── PARSED DATA GLOBALS ───────────────────────────────────
var GD=[], MA=[], MM=[], IG_ALL=[];
// Master (unfiltered) copies — filters derive from these
var GD_ALL_MASTER=[], MA_ALL_MASTER=[], MM_ALL_MASTER=[], IG_ALL_MASTER=[];
// Active filters
var FILTER = { range: 'all', platforms: {airlie:true, mackay:true, google:true, instagram:true} };
var lastUpdated = '';

// ── FETCH & PARSE ─────────────────────────────────────────
function refreshData(){
  document.getElementById('loadingText').textContent = 'Refreshing data…';
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
  loadData();
}

function loadData(){
  setLoading('Fetching live data…');
  var liveExport = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=0';
  // Fetch through your own Cloudflare Worker (reliable, no rate limits, always fresh).
  // Falls back to the published CSV only if the Worker is unreachable.
  var sources = [
    'https://claude-proxy.mackay.workers.dev/sheet?_t=' + Date.now(),
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vR3_hJyEajEuSmp2XOSw9WYEXrcXNJ4KahLqYMF4sbdDLo-SvHiY-9d73dnVw4lkEk4sJKx4b_2VzqX/pub?output=csv&_t=' + Date.now()
  ];
  var idx = 0;
  var hardTimeout = setTimeout(function(){
    setLoading('Using cached data…');
    useFallbackData();
    renderAll();
    hideLoading(true);
  }, 10000);

  function tryFetch(){
    if(idx >= sources.length){
      setLoading('Using cached data…');
      clearTimeout(hardTimeout);
      setTimeout(function(){useFallbackData();renderAll();hideLoading(true);},300);
      return;
    }
    fetch(sources[idx], {cache: 'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.text();
      })
      .then(function(csv){
        if(!csv || csv.length < 100) throw new Error('Empty response');
        clearTimeout(hardTimeout);
        setLoading('Parsing data…');
        parseCSV(csv);
        setLoading('Building dashboard…');
        setTimeout(function(){renderAll();hideLoading();},300);
      })
      .catch(function(err){
        console.warn('Source '+idx+' failed:',err);
        idx++;
        tryFetch();
      });
  }
  tryFetch();
}

function setLoading(msg){
  document.getElementById('loadingText').textContent = msg;
}

function hideLoading(error){
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  var d = new Date();
  var label = d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dateLabel').innerHTML = '<span class="status-dot" style="background:'+(error?'var(--yl)':'var(--gr)')+'"></span>' + (error ? 'Cached — ' : 'Live — ') + label;
}

function parseCSV(csv){
  var lines = csv.split('\n').filter(function(l){return l.trim();});
  // Skip header row
  var rows = lines.slice(1).map(function(line){
    // Handle CSV quoting
    var cols = [];
    var cur = '', inQ = false;
    for(var i=0;i<line.length;i++){
      var c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){cols.push(cur.trim());cur='';}
      else{cur+=c;}
    }
    cols.push(cur.trim());
    return cols;
  });

  // Columns: Date(0) Platform(1) Impressions(2) Clicks(3) CTR(4) Spend(5) Reach(6)
  var gdMap={}, maMap={}, mmMap={}, igMap={};

  rows.forEach(function(r){
    var rawDate = r[0]||'';
    var platform = (r[1]||'').trim();
    var imps = parseFloat(r[2])||0;
    var clicks = parseFloat(r[3])||0;
    var spend = parseFloat(r[5])||0;
    var reach = parseFloat(r[6])||0;

    // Skip bad/empty dates
    if(!rawDate || rawDate.indexOf('formatDate')>-1 || rawDate.indexOf('Date')>-1) return;

    // Normalise date to M/D/YYYY → short M/D
    var dp = rawDate.replace(/\//g,'/');
    var parts = dp.split('/');
    if(parts.length<3) return;
    var mm = parseInt(parts[0]), dd = parseInt(parts[1]);
    var d = dd+'/'+mm; // display as D/M e.g. "4/8"
    var sortKey = mm*100+dd; // for correct chronological sorting
    var mo_num = mm; // month number for monthly filtering

    if(platform==='Google Ads'){
      // Exclude stuck value
      if(Math.abs(spend-STUCK_SPEND)<0.01) return;
      if(!gdMap[d]||spend>0) gdMap[d]={d:d,sk:sortKey,mo:mo_num,sp:spend,cl:clicks,im:imps};
    } else if(platform==='Meta Ads'||platform==='Meta Ads Airlie'){
      if(spend>0||imps>0) maMap[d]={d:d,sk:sortKey,mo:mo_num,sp:spend,cl:clicks,im:imps,re:reach};
    } else if(platform==='Meta Ads Mackay'){
      if(spend>0||imps>0) mmMap[d]={d:d,sk:sortKey,mo:mo_num,sp:spend,cl:clicks,im:imps,re:reach};
    } else if(platform==='Instagram'){
      if(reach>0) igMap[d]={d:d,sk:sortKey,mo:mo_num,re:reach};
    }
  });

  function sortObj(obj){
    return Object.keys(obj).map(function(k){return obj[k];}).sort(function(a,b){return a.sk-b.sk;});
  }

  GD_ALL_MASTER = sortObj(gdMap);
  MA_ALL_MASTER = sortObj(maMap);
  MM_ALL_MASTER = sortObj(mmMap);
  IG_ALL_MASTER = sortObj(igMap);
  lastUpdated = new Date().toLocaleString('en-AU');
  applyFilters();
}

// Apply the active date-range + platform filters to produce the working arrays
function applyFilters(){
  // Date range filter
  var maxSk = 0;
  [].concat(MA_ALL_MASTER, MM_ALL_MASTER, GD_ALL_MASTER, IG_ALL_MASTER).forEach(function(r){ if(r.sk>maxSk) maxSk=r.sk; });
  function skToNum(sk){ return sk; } // sortKey already month*100+day, chronological within a year
  function inRange(r){
    if(FILTER.range==='all') return true;
    // Build a comparable "day index" — approximate using sortKey ordering of unique dates
    return true; // replaced below by rangeAllowed set
  }
  // Build ordered unique date list to support "last N days" and "this month"
  var allRecs = [].concat(MA_ALL_MASTER, MM_ALL_MASTER, GD_ALL_MASTER, IG_ALL_MASTER);
  var uniqueDates = [...new Set(allRecs.map(function(r){return r.d;}))];
  uniqueDates.sort(function(a,b){
    var ap=a.split('/'),bp=b.split('/');
    var ak=parseInt(ap[1])*100+parseInt(ap[0]);
    var bk=parseInt(bp[1])*100+parseInt(bp[0]);
    return ak-bk;
  });
  var allowed = null; // null = all allowed
  if(FILTER.range==='7'){ allowed = new Set(uniqueDates.slice(-7)); }
  else if(FILTER.range==='30'){ allowed = new Set(uniqueDates.slice(-30)); }
  else if(FILTER.range==='month'){
    var thisMo = new Date().getMonth()+1;
    allowed = new Set(allRecs.filter(function(r){return r.mo===thisMo;}).map(function(r){return r.d;}));
  }
  function dateOk(r){ return allowed===null || allowed.has(r.d); }

  // Platform filter + date filter
  MA = FILTER.platforms.airlie ? MA_ALL_MASTER.filter(dateOk) : [];
  MM = FILTER.platforms.mackay ? MM_ALL_MASTER.filter(dateOk) : [];
  GD = FILTER.platforms.google ? GD_ALL_MASTER.filter(dateOk) : [];
  IG_ALL = FILTER.platforms.instagram ? IG_ALL_MASTER.filter(dateOk) : [];
}

  GD=[{d:'18/8',sp:27.20,cl:5,im:511},{d:'19/8',sp:26.69,cl:13,im:283},{d:'20/8',sp:25.97,cl:15,im:1111},{d:'21/8',sp:25.99,cl:18,im:836},{d:'22/8',sp:15.03,cl:18,im:963},{d:'23/8',sp:14.37,cl:26,im:2089},{d:'24/8',sp:6.81,cl:10,im:1368},{d:'25/8',sp:22.03,cl:10,im:484}];

  MM=[{d:'12/8',sp:14.11,cl:54,im:2044,re:1765},{d:'13/8',sp:16.46,cl:153,im:2854,re:2411},{d:'14/8',sp:11.41,cl:75,im:2057,re:1835},{d:'15/8',sp:12.29,cl:112,im:1814,re:1677},{d:'16/8',sp:12.68,cl:103,im:2072,re:1913},{d:'17/8',sp:14.52,cl:91,im:2390,re:2151},{d:'18/8',sp:13.72,cl:95,im:2119,re:1921},{d:'19/8',sp:13.99,cl:90,im:2201,re:1994},{d:'20/8',sp:13.42,cl:95,im:2094,re:1969},{d:'21/8',sp:14.67,cl:112,im:2182,re:2026},{d:'22/8',sp:11.62,cl:81,im:1784,re:1670},{d:'23/8',sp:15.51,cl:118,im:2594,re:2532},{d:'24/8',sp:14.86,cl:115,im:2703,re:2585},{d:'25/8',sp:13.58,cl:103,im:2387,re:2252}];
  IG_ALL=[{d:'4/8',re:275},{d:'5/8',re:387},{d:'6/8',re:225},{d:'7/8',re:235},{d:'8/8',re:196},{d:'9/8',re:239},{d:'10/8',re:640},{d:'11/8',re:660},{d:'12/8',re:849},{d:'13/8',re:392},{d:'14/8',re:380},{d:'15/8',re:294},{d:'16/8',re:238},{d:'17/8',re:337},{d:'18/8',re:372},{d:'19/8',re:456},{d:'20/8',re:254},{d:'21/8',re:1512},{d:'22/8',re:1382},{d:'23/8',re:511},{d:'24/8',re:863},{d:'25/8',re:1161}];
}

// ── HELPERS ──────────────────────────────────────────────
var CH={};
function sf(a,f){return a.reduce(function(t,r){return t+(r[f]||0);},0);}
function fm(n){return n>=1000?(n/1000).toFixed(1)+'k':Math.round(n).toString();}
function mo(n){return '$'+parseFloat(n).toFixed(2);}
function pc(n){return parseFloat(n).toFixed(2)+'%';}
function el(tag,cls,style){var e=document.createElement(tag);if(cls)e.className=cls;if(style)e.style.cssText=style;return e;}
function kp(l,v,s,c){var d=el('div','kpi');d.innerHTML='<div class="kl">'+l+'</div><div class="kv'+(c?' '+c:'')+'">'+v+'</div><div class="ks">'+(s||'')+'</div>';return d.outerHTML;}
function tb(hs,rs){var h='<tr>'+hs.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>';var r=rs.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('');return '<table class="tbl">'+h+r+'</table>';}
var Y1={type:'linear',display:true,position:'right',grid:{drawOnChartArea:false},ticks:{color:'#888',font:{size:9}}};
function mc(id,type,data,y1){
  var ctx=document.getElementById(id);if(!ctx)return;
  if(CH[id])CH[id].destroy();
  var sc={};
  if(type!=='doughnut'&&type!=='pie'){sc={x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#888',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#888',font:{size:9}}}};if(y1)sc.y1=Y1;}
  CH[id]=new Chart(ctx,{type:type,data:data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#888',font:{size:10}}}},scales:sc}});
}
function gs(id){return document.getElementById('sec-'+id);}
function wrow(label,lw,tw,fmt,lowerBetter,noLW){
  function fv(v,f){return f==='$'?mo(v):f==='%'?pc(v):typeof v==='string'?v:Math.round(v).toString();}
  var chg=noLW?null:((tw-lw)/(lw||1)*100);
  var good=lowerBetter?chg<=0:chg>=0;
  var cls=good?'color:var(--gr)':'color:var(--re)';
  var lwCell=noLW?'<span class="no-data">No data</span>':'<span class="wk-val">'+fv(lw,fmt)+'</span>';
  var chgCell=noLW?'<span class="no-data">—</span>':'<span style="'+cls+';font-size:12px;font-weight:600;">'+(chg>=0?'↑':'↓')+Math.abs(chg).toFixed(1)+'%</span>';

function getPeriodLabel(){
  var allDates=[].concat(MA.map(function(r){return r.d;}),MM.map(function(r){return r.d;}),GD.map(function(r){return r.d;}));
  if(!allDates.length) return 'No data';
  return allDates[0]+' – '+allDates[allDates.length-1];
}

function getLastNDays(n){
  // Get last n days worth of dates across all data
  var allDates=[].concat(
    MA.map(function(r){return r.d;}),
    MM.map(function(r){return r.d;}),
    GD.map(function(r){return r.d;})
  );
  var unique=[...new Set(allDates)].sort(function(a,b){
    var ap=a.split('/'),bp=b.split('/');
    var ak=parseInt(ap[1])*100+parseInt(ap[0]);
    var bk=parseInt(bp[1])*100+parseInt(bp[0]);
    return ak-bk;
  });
  var tw=unique.slice(-7);
  var lw=unique.slice(-14,-7);
  return {lw:lw,tw:tw};
}

function setRange(r){
  FILTER.range = r;
  applyFilters();
  renderAll();
}
function togglePlatform(p){
  FILTER.platforms[p] = !FILTER.platforms[p];
  // Prevent turning everything off
  var anyOn = Object.keys(FILTER.platforms).some(function(k){return FILTER.platforms[k];});
  if(!anyOn){ FILTER.platforms[p] = true; }
  applyFilters();
  renderAll();
}

// Auto-refresh every day at 6:30 AM (after Make.com 6:00 AM run)
function scheduleDailyRefresh(){
  function msUntilNext630(){
    var now = new Date();
    var next = new Date();
    next.setHours(6,30,0,0);
    if(now >= next){ next.setDate(next.getDate()+1); }
    return next - now;
  }
  function scheduleNext(){
    var wait = msUntilNext630();
    setTimeout(function(){
      // Silent refresh without full-screen loader
      silentRefresh();
      scheduleNext(); // reschedule for the following day
    }, wait);
  }
  scheduleNext();
}

// Refresh data in the background without showing the loading screen
function silentRefresh(){
  var publishedCsvUrl = 'https://claude-proxy.mackay.workers.dev/sheet';
  fetch(publishedCsvUrl + '?_t=' + Date.now(), {cache: 'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(csv){
      if(!csv || csv.length < 100) throw new Error('Empty');
      parseCSV(csv);
      renderAll();
      var d = new Date();
      document.getElementById('dateLabel').innerHTML = '<span class="status-dot"></span>Auto-updated ' + d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
    })
    .catch(function(err){ console.warn('Auto-refresh failed:',err); });
}
